[package]
name = "argus-server"
description = "The Argus NVR server."
version.workspace = true
edition.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "argus"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
chrono-tz = "0.10"
hkdf = "0.12"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
argus-ingest.workspace = true
argus-agent.workspace = true
argus-detect.workspace = true
argus-media.workspace = true
argus-plan.workspace = true
argus-proto.workspace = true
argus-store.workspace = true
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
futures.workspace = true
getrandom.workspace = true
object_store.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true, features = ["json"] }
tokio-tungstenite = "0.28"
tempfile.workspace = true
