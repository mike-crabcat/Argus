<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Argus</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Argus">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0C0C0E">
<script src="/push.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0C0C0E; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #status { position: absolute; inset: 0; display: grid; place-items: center;
            color: #5C5C64; font: 13.5px system-ui, sans-serif; pointer-events: none; }
</style>
</head>
<body>
<canvas id="argus"></canvas>
<div id="status">Loading Argus…</div>
<script type="module">
  import init from "./argus_web.js";
  init().catch((e) => {
    document.getElementById("status").textContent = "Argus failed to load: " + e;
  });
</script>
</body>
</html>
