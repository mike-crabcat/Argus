name: Docker image

# Builds and publishes ghcr.io/<owner>/argus after CI passes on main.
# Never runs for pull requests, so no fork can reach the package token.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One build at a time, in order; a newer one never races an older one.
concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  image:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      # The commit CI tested. (github.sha is the newest main for
      # workflow_run events, which may be a later commit.)
      BUILD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD_SHA }}
      # Only the commit that is still main's head gets the `main` tag, so a
      # slow build of an older commit can't roll the deployment back.
      - id: head
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          echo "short=${BUILD_SHA::7}" >> "$GITHUB_OUTPUT"
          if [ "$head" = "$BUILD_SHA" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$BUILD_SHA is no longer main's head ($head); not moving the main tag"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/argus
          tags: |
            type=raw,value=main,enable=${{ steps.head.outputs.latest }}
            type=raw,value=sha-${{ steps.head.outputs.short }}
          labels: |
            org.opencontainers.image.revision=${{ env.BUILD_SHA }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ARGUS_GIT_SHA=${{ env.BUILD_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
