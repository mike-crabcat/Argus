# Argus configuration. Copy to argus.toml and edit.

[storage]
# Local hot tier: recordings, init segments and index.sqlite live here.
root = "/var/lib/argus"
# Each chunk object holds about this many seconds of one stream.
chunk_seconds = 60
# Optional cap on local recordings, in GB. Above it, the oldest chunks that
# are safe to drop locally are deleted: ones already uploaded, "never"
# streams, and "events" chunks with no event nearby once an hour old.
# A chunk still waiting to upload is never deleted.
local_budget_gb = 500

# Optional: the HTTP API and live view. Browsers need HTTPS for video
# decoding, so keep this on localhost and put `tailscale serve` in front:
#   tailscale serve --bg https / http://127.0.0.1:8080
[http]
listen = "127.0.0.1:8080"
# token = "a long random string"   # then every API request needs it;
#                                  # open the app as https://host/?token=...
# The browser app, built with scripts/build-web.sh:
# web_root = "web/dist"
# The address phones reach Argus at. Phones are added from the viewer
# (Phones, then Add phone) with a QR code that points here and carries the
# phone's own token; revoke a phone there too. Without it the QR code uses
# the address the viewer is open at.
# public_url = "https://host.your-tailnet.ts.net:8444"

# Optional: copy recordings to S3 or any S3-compatible store (MinIO,
# Backblaze B2, Wasabi...). Without this section everything stays local.
[s3]
bucket = "my-nvr"
region = "us-east-1"
# endpoint = "https://s3.us-west-004.backblazeb2.com"   # non-AWS stores
# prefix = "argus"                                       # key prefix in the bucket
# Credentials: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY env vars, or
# ~/.aws/credentials (profile below, $AWS_PROFILE or "default"), or here:
# profile = "nvr"
# access_key_id = "..."
# secret_access_key = "..."
# Average upload cap in Mbit/s, so catching up never fills the line. 0 = no cap.
max_upload_mbps = 50

# Which chunks go to S3, per stream (camera.upload.<stream>):
#   "always" - every chunk. Default for every stream except "main".
#   "events" - chunks within 10 s of an event. Default for "main".
#   "never"  - local only.
# So by default the low-res sub stream is always in S3, and full resolution
# only around events. Mark one by hand with:
#   argus event add --camera driveway --from now-5m --to now
#
# Events also come from the cameras' own detections. Reolink cameras are
# recognised from their stream URLs and polled read-only for person, vehicle
# and animal detections, using the host and credentials in the stream URL.
# Override per camera with [camera.events] (see front_door below), or turn
# it off with: events = { source = "none" }. To see what each camera
# reports: argus event watch --seconds 30

# Reolink tips:
#  * H.264 streams: prefer HTTP-FLV, Reolink's RTSP server is unreliable.
#  * H.265 main streams (4K models) are only offered over RTSP.
#  * Set "I-frame interval" to 1x the frame rate so seeks land within a second.

[[camera]]
name = "driveway"
streams.main = "rtsp://admin:password@192.168.1.20:554/h265Preview_01_main"
streams.sub = "http://192.168.1.20/flv?port=1935&app=bcs&stream=channel0_sub.bcs&user=admin&password=password"

[[camera]]
name = "front_door"
streams.main = "http://192.168.1.21/flv?port=1935&app=bcs&stream=channel0_main.bcs&user=admin&password=password"
streams.sub = "http://192.168.1.21/flv?port=1935&app=bcs&stream=channel0_sub.bcs&user=admin&password=password"
# Keep this camera's full resolution in S3 all the time.
upload.main = "always"
# Optional: what the camera looks at, in a sentence, for event summaries
# and alert checks (until the floor plan says it, or to add to it).
context = "the front porch and the path out to the street"

[camera.events]
# source = "reolink"                 # or "none"
# url = "http://192.168.1.21"        # default: the stream URL's host
# user = "admin"                     # default: from the stream URL
# password = "password"
labels = ["person", "vehicle", "animal", "motion"]   # default: no motion
poll_ms = 1000
hold_ms = 5000                       # end an event 5 s after last detection
stills = true                        # snapshots at +0, +2 and +5 s (Snap API)
summarize = true                     # let the agent summarise this camera's events
# summary_gap_seconds = 600          # this camera's own gap (default: [agent]'s)
# detect = "shadow"                  # with [detect]: "shadow" stores Argus's tracks
                                     # to compare; "events" makes this camera's
                                     # events from them instead

# Optional: a model for agent features (importing a floor plan from a
# sketch, "ask the agent to change the plan"). Any OpenAI-compatible
# chat-completions API works: OpenAI, OpenRouter, Zhipu GLM, a local server.
# The key lives in its own file (chmod 600), never in this one. Prices let
# Argus track spending against the monthly cap. Without this section the
# agent features just say a model needs setting up.
# [agent]
# provider = "openai"
# base_url = "https://openrouter.ai/api/v1"
# model = "vendor/model-name"
# api_key_file = "/home/you/.config/argus/agent-key"
# monthly_cap_usd = 10
# price_input_per_mtok = 0.5     # USD per million input tokens
# price_output_per_mtok = 1.5
# timeout_seconds = 120
# max_steps = 6
# summaries = true               # summarise events in the background
# summary_gap_seconds = 60       # at most one per camera per minute (merged)
# still_max_edge = 1280          # shrink stills to this many px for the model
                                 # (0: full size); the saved stills stay full size

# Optional: Argus's own object detection (in progress). Each camera's sub
# stream is decoded on the CPU and 5 pictures a second go to the model on
# the GPU. What moves is stored as tracks; see events.detect per camera.
# The model is D-FINE-S (Apache-2.0): download onnx/model.onnx from
# https://huggingface.co/onnx-community/dfine_s_coco-ONNX (41 MB). The
# Docker image has CUDA; give the container the GPU (see docs/deploy.md).
# [detect]
# model = "/var/lib/argus/models/dfine_s_coco.onnx"
# device = "cuda"                # "cuda", "cuda:N" or "cpu"
# threshold = 0.5                # drop detections less sure than this
# fps = 5                        # pictures a second to look at, per camera
# stream = "sub"                 # which stream to decode (H.264)
# cameras = []                   # empty: all
# log_seconds = 600              # how often to log what it found

# Optional: alerts and the daily brief. Notifications go to browsers that
# enable them in the viewer (Alerts, then "Enable notifications"; on an
# iPhone, add Argus to the Home Screen first). Rules are added in the
# viewer in plain English; with an [agent] the model turns them into
# filters. These are the defaults:
# [alerts]
# timezone = "Australia/Perth"   # for rule times and the brief
# brief_time = "07:00"           # daily brief (needs [agent])
# brief = true
# contact = "mailto:you@example.com"   # sent to push services; optional
#
# Also send alerts to an ntfy topic (https://ntfy.sh or your own server):
# [alerts.ntfy]
# url = "https://ntfy.sh/your-secret-topic"
# token_file = "/home/you/.config/argus/ntfy-token"   # for protected topics
